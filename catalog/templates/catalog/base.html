{% load static %}<!doctype html>
<html lang="en" data-theme="{{ active_theme.id }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="{{ active_theme.color_scheme }}">
  <meta name="theme-color" content="{{ active_theme.background }}">
  <title>{% block title %}Stacks{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=EB+Garamond:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'catalog/stacks.css' %}">
  <script src="{% static 'catalog/htmx.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <div class="paper-texture" aria-hidden="true"></div>
  <header class="site-header">
    <a class="brand" href="{% url 'library' %}">Stacks</a>
    {% if user.is_authenticated %}
    <nav aria-label="Main">
      <a href="{% url 'library' %}" {% if request.resolver_match.url_name == 'library' %}aria-current="page"{% endif %}>Library</a>
      <a href="{% url 'add' %}" {% if request.resolver_match.url_name == 'add' %}aria-current="page"{% endif %}>Add</a>
      <a href="{% url 'review' %}" {% if request.resolver_match.url_name == 'review' %}aria-current="page"{% endif %}>Review</a>
      <a href="{% url 'settings' %}" {% if request.resolver_match.url_name == 'settings' %}aria-current="page"{% endif %}>Settings</a>
      <form method="post" action="{% url 'logout' %}" class="inline-form">
        {% csrf_token %}<button type="submit" class="link-button">Log out</button>
      </form>
    </nav>
    {% endif %}
  </header>

  <main>
    {% if messages %}
    <ul class="messages" role="status">
      {% for message in messages %}<li class="message {{ message.level_tag }}">{{ message }}</li>{% endfor %}
    </ul>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
